name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: plugin (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: sh plugins/p/bin/python-launcher -B -m unittest discover -s plugins/p/tests -t plugins/p/tests

      - name: Hook and manifest end-to-end checks
        run: sh plugins/p/bin/python-launcher -B plugins/p/bin/format-e2e

      - name: Stopped-promises self-test
        run: sh plugins/p/bin/python-launcher -B plugins/p/bin/stopped-promises.py --selftest

      - name: Universal source and installed-copy checks
        run: sh plugins/p/bin/p-validate

      - name: POSIX shell syntax
        shell: bash
        run: |
          for f in plugins/p/bin/*; do
            [ -f "$f" ] || continue
            if head -n 1 "$f" | grep -q '^#!/usr/bin/env sh$'; then
              sh -n "$f" || exit 1
            fi
          done

      - name: Repository privacy audit
        shell: bash
        run: sh plugins/p/bin/repo-privacy-audit -C .

      - name: Whitespace hygiene across the committed tree
        shell: bash
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
