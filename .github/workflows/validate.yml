name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (ubuntu-latest, python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: sh plugins/p/bin/python-launcher -B -m unittest discover -s plugins/p/tests -t plugins/p/tests

      - name: Stopped-promises self-test
        run: sh plugins/p/bin/python-launcher -B plugins/p/bin/stopped-promises.py --selftest

      - name: Universal source and installed-copy checks
        run: sh plugins/p/bin/p-validate

      - name: POSIX shell syntax
        shell: bash
        run: |
          for f in plugins/p/bin/*; do
            [ -f "$f" ] || continue
            if head -n 1 "$f" | grep -q '^#!/usr/bin/env sh$'; then
              sh -n "$f" || exit 1
            fi
          done

      - name: Repository privacy audit
        shell: bash
        run: sh plugins/p/bin/repo-privacy-audit -C .

      - name: Whitespace hygiene across the committed tree
        shell: bash
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  windows-smoke:
    name: windows smoke (windows-latest, python 3.14)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Universal source and installed-copy checks
        shell: bash
        run: sh plugins/p/bin/p-validate

      - name: Cross-platform CLI and skill smoke tests
        shell: bash
        run: PYTHONPATH=plugins/p/tests sh plugins/p/bin/python-launcher -B -m unittest test_validator test_universal_plugin test_plugin_root_convention test_readme test_ci_contract test_release_bump test_python_launcher test_repo_safety_skills test_skill_activation test_native_activation_scope test_statusline test_statusline_renderer test_antigravity_statusline test_antigravity_install_health test_antigravity_session_ids test_adequacy_review_portability test_sparring_skills test_writing_goals

  optional-analytics:
    name: optional analytics (ubuntu-latest, python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether evaluation paths changed
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          if printf '%s\n' "$changed" | grep -Eq '^(plugins/p/retro_eval/|plugins/p/rubrics/|plugins/p/requirements-eval\.txt$|plugins/p/tests/test_eval_|\.github/workflows/validate\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned optional analytics packages (wheels only)
        if: steps.filter.outputs.run == 'true'
        run: |
          python -m pip install --only-binary :all: -r plugins/p/requirements-eval.txt

      - name: Evaluation tests with the optional paths required
        if: steps.filter.outputs.run == 'true'
        env:
          RETRO_EVAL_REQUIRE_OPTIONAL: "1"
        run: python -B -m unittest discover -s plugins/p/tests -t plugins/p/tests -p "test_eval_*.py"
